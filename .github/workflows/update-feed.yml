name: Update market wire

# Runs automatically every 15 minutes, and lets you trigger it manually
# from the Actions tab in GitHub for testing. GitHub's scheduler is
# best-effort, not exact - actual gaps between runs can be longer,
# especially under GitHub Actions load.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Needed so this workflow is allowed to push the updated alerts.json
# back to the repo.
permissions:
  contents: write

# Queue overlapping runs instead of letting them race each other's
# git push (a scheduled run and a manual trigger landing close
# together caused exactly this failure before this was added).
concurrency:
  group: update-market-wire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run the bot
        env:
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_CHAT_ID: ${{ secrets.WAHA_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run main.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "market-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerts.json seen_items.json market_kpis.json
          if ! git diff --staged --quiet; then
            git commit -m "Update alerts"
            git pull --rebase -X ours origin main
            git push
          else
            echo "No changes to commit."
          fi