name: Update market wire

# No `schedule:` trigger here on purpose - GitHub's own cron scheduler
# is best-effort and was observed firing 1-4+ hours apart despite a
# */15 cron, especially overnight. An external cron service calls the
# workflow_dispatch API on a real schedule instead (see project notes).
# This also still lets you trigger it manually from the Actions tab.
#
# `mode` distinguishes the every-15-min real-time run (default, no
# `inputs` needed - the existing cron-job.org job keeps working as-is;
# this mode only fetches/filters/records to the dashboard, it no
# longer posts to WhatsApp - see main.py) from the digest runs, which
# need their own separate cron-job.org jobs POSTing {"ref": "main",
# "inputs": {"mode": "hourly"}} (or "morning"/"evening"/"weekly"/
# "monthly") at the desired times. "hourly" is the one that actually
# reaches WhatsApp for routine updates - see digest.py. Suggested
# schedules for the two newest: weekly ~Friday 4:30 PM IST (after
# close), monthly ~1st of the month, morning (rolling 30-day window,
# not calendar-month-aligned - see digest.py).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "realtime"
        type: choice
        options:
          - realtime
          - hourly
          - morning
          - evening
          - weekly
          - monthly

# Needed so this workflow is allowed to push the updated alerts.json
# back to the repo.
permissions:
  contents: write

# Queue overlapping runs instead of letting them race each other's
# git push (a scheduled run and a manual trigger landing close
# together caused exactly this failure before this was added).
concurrency:
  group: update-market-wire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run tests
        run: uv run --group dev pytest tests/

      - name: Run the bot
        env:
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_CHAT_ID: ${{ secrets.WAHA_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run main.py --mode=${{ github.event.inputs.mode || 'realtime' }}

      - name: Commit updated data if it changed
        run: |
          git config user.name "market-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerts.json seen_items.json market_kpis.json
          if ! git diff --staged --quiet; then
            git commit -m "Update alerts"
            git pull --rebase -X ours origin main
            git push
          else
            echo "No changes to commit."
          fi