<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-raised: #171b21;
    --hairline: #23272e;
    --text: #d8d5ce;
    --muted: #5b6169;
    --amber: #e3a857;
    --teal: #4fa89e;
    --rust: #c97b4a;
    --red: #d9756b;
    --silver-tone: #9aa3ad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }

  /* --- Ticker strip: signature element --- */
  .ticker-strip {
    background: var(--panel);
    border-bottom: 1px solid var(--hairline);
    overflow: hidden;
    white-space: nowrap;
    padding: 6px 0;
  }

  .ticker-track {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--amber);
    letter-spacing: 0.02em;
    animation: scroll 180s linear infinite; /* higher = slower. was 90s, then 40s */
    padding-left: 100%;
  }

  .ticker-track span { margin-right: 48px; }

  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; padding-left: 24px; }
  }

  /* --- KPI strip --- */
  .kpi-strip {
    background: var(--panel);
    border-bottom: 1px solid var(--hairline);
    padding: 18px 0 20px;
  }

  .kpi-section-label {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 24px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .kpi-track {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 10px;
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 24px;
  }

  @media (max-width: 1100px) {
    .kpi-track { grid-template-columns: repeat(5, 1fr); }
  }

  @media (max-width: 640px) {
    .kpi-track { grid-template-columns: repeat(2, 1fr); }
  }

  .kpi-tile {
    background: var(--panel-raised);
    border: 1px solid var(--hairline);
    border-top: 2px solid var(--tile-accent, var(--hairline));
    border-radius: 6px;
    padding: 10px 12px;
  }

  .kpi-icon-label {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .kpi-icon { font-size: 11px; line-height: 1; }

  .kpi-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .kpi-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-top: 4px;
  }

  .kpi-change {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    margin-top: 1px;
  }

  .kpi-change.up { color: #6bbf8f; }
  .kpi-change.down { color: #d9756b; }
  .kpi-change.flat { color: var(--muted); }

  .kpi-stale {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* --- Header --- */
  header {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 16px;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .subtitle {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .rule {
    border: none;
    border-top: 1px solid var(--amber);
    opacity: 0.5;
    margin: 14px 0 0;
  }

  /* --- Feed --- */
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }

  #feed {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .alert-card {
    display: grid;
    grid-template-columns: 84px 1fr;
    gap: 16px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--card-accent, var(--hairline));
    border-radius: 8px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .alert-card:hover {
    transform: translateY(-1px);
    border-color: var(--amber);
  }

  .alert-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }

  .alert-meta .source {
    display: inline-block;
    color: var(--teal);
    background: rgba(79, 168, 158, 0.12);
    border-radius: 10px;
    padding: 2px 7px;
    margin-top: 6px;
    font-size: 10px;
  }

  .alert-title {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }

  .alert-title .cat-icon {
    font-size: 13px;
    line-height: 1;
    flex-shrink: 0;
  }

  .alert-title a {
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.45;
  }

  .alert-title a:hover,
  .alert-title a:focus-visible {
    color: var(--amber);
    text-decoration: underline;
  }

  .alert-summary {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .alert-section {
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }

  .section-icon {
    margin-right: 3px;
  }

  .section-label {
    color: var(--text);
    font-weight: 600;
    margin-right: 4px;
  }

  .section-body {
    color: var(--muted);
  }

  .empty-state {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    font-style: italic;
    padding: 60px 0;
    text-align: center;
    font-size: 13px;
  }

  a:focus-visible, .dot:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }
</style>
</head>
<body>

  <div class="ticker-strip">
    <div class="ticker-track" id="tickerTrack">
      <span>Waiting for wire activity&hellip;</span>
    </div>
  </div>

  <div class="kpi-strip">
    <div class="kpi-section-label">Markets</div>
    <div class="kpi-track" id="kpiTrack"></div>
  </div>

  <header>
    <div class="title-row">
      <h1>Market Wire</h1>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="lastUpdated">checking&hellip;</span>
      </div>
    </div>
    <p class="subtitle">Macro &amp; geopolitical market alerts, curated live</p>
    <hr class="rule">
  </header>

  <main id="feed">
    <p class="empty-state">Loading feed&hellip;</p>
  </main>

<script>
  const REFRESH_MS = 20000;

  function timeAgo(isoString) {
    const seconds = Math.floor((Date.now() - new Date(isoString)) / 1000);
    if (seconds < 60) return `${seconds}s ago`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    return `${hours}h ago`;
  }

  function formatClock(isoString) {
    const d = new Date(isoString);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  const ALERT_CATEGORIES = [
    { test: /gold|silver|bullion/i, icon: '🥇', color: 'var(--amber)' },
    { test: /crude|oil|opec|brent|\bwti\b/i, icon: '🛢️', color: 'var(--rust)' },
    { test: /war|conflict|iran|israel|russia|ukraine|sanction|tension|ceasefire|\battack\b|\bstrike\b/i, icon: '⚡', color: 'var(--red)' },
    { test: /\bfed\b|\brbi\b|inflation|rate|\bgdp\b|\bcpi\b|\bwpi\b|jobs|employment|payroll|recession/i, icon: '🏦', color: 'var(--teal)' },
  ];

  function categorize(title) {
    for (const cat of ALERT_CATEGORIES) {
      if (cat.test.test(title)) return cat;
    }
    return { icon: '📰', color: 'var(--hairline)' };
  }

  // AI summaries come formatted for WhatsApp - *bold* markers and
  // inline emoji, blocks separated by a blank line (see
  // formatter.py's _parse_structured_summary). Browsers don't render
  // that markdown, so shown raw it's just literal asterisks cluttering
  // the text. Parse each "<icon> *Label:* body" block into a proper
  // labeled row instead. Falls back to plain text for summaries that
  // aren't in this format (the cleaned-RSS-description fallback used
  // when no AI summary was generated).
  function renderSummary(summary) {
    if (!summary) return '';

    const blocks = summary.split('\n\n').map(b => b.trim()).filter(Boolean);
    const parsed = blocks.map(b => {
      const m = b.match(/^([^*]*)\*([^*]+):\*\s*([\s\S]*)$/);
      return m ? { icon: m[1].trim(), label: m[2].trim(), body: m[3].trim() } : null;
    });

    if (parsed.length && parsed.every(Boolean)) {
      return parsed.map(p => `
        <div class="alert-section">
          ${p.icon ? `<span class="section-icon" aria-hidden="true">${escapeHtml(p.icon)}</span>` : ''}
          <span class="section-label">${escapeHtml(p.label)}:</span>
          <span class="section-body">${escapeHtml(p.body)}</span>
        </div>
      `).join('');
    }

    return `<div class="alert-section"><span class="section-body">${escapeHtml(summary)}</span></div>`;
  }

  function render(alerts) {
    const feed = document.getElementById('feed');
    const ticker = document.getElementById('tickerTrack');
    const lastUpdated = document.getElementById('lastUpdated');

    lastUpdated.textContent = `updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

    if (!alerts.length) {
      feed.innerHTML = '<p class="empty-state">No alerts yet — the wire is quiet.</p>';
      ticker.innerHTML = '<span>Waiting for wire activity&hellip;</span>';
      return;
    }

    feed.innerHTML = alerts.map(a => {
      const cat = categorize(a.title);
      return `
      <div class="alert-card" style="--card-accent:${cat.color}">
        <div class="alert-meta">
          ${formatClock(a.fetched_at)}
          <span class="source">${escapeHtml(a.source)}</span>
        </div>
        <div>
          <div class="alert-title">
            <span class="cat-icon" aria-hidden="true">${cat.icon}</span>
            <a href="${escapeAttr(a.link)}" target="_blank" rel="noopener noreferrer">
              ${escapeHtml(a.title)}
            </a>
          </div>
          ${a.summary ? `<div class="alert-summary">${renderSummary(a.summary)}</div>` : ''}
        </div>
      </div>
    `;
    }).join('');

    const tickerItems = alerts.slice(0, 8)
      .map(a => `<span>${escapeHtml(a.title)} (${timeAgo(a.fetched_at)})</span>`)
      .join('');
    ticker.innerHTML = tickerItems + tickerItems; // duplicate for seamless loop
  }

  const KPI_META = {
    nifty:             { icon: '📈', accent: 'var(--teal)' },
    sensex:            { icon: '📈', accent: 'var(--teal)' },
    gold:              { icon: '🥇', accent: 'var(--amber)' },
    gold_inr_approx:   { icon: '🥇', accent: 'var(--amber)' },
    silver:            { icon: '🥈', accent: 'var(--silver-tone)' },
    silver_inr_approx: { icon: '🥈', accent: 'var(--silver-tone)' },
    crude:             { icon: '🛢️', accent: 'var(--rust)' },
    fii:               { icon: '🏦', accent: 'var(--teal)' },
    dii:               { icon: '🏦', accent: 'var(--teal)' },
    usd_inr:           { icon: '💱', accent: 'var(--teal)' },
  };
  const KPI_ORDER = Object.keys(KPI_META);

  function formatNumber(n) {
    return n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  function renderKpiTile(key, kpi) {
    if (!kpi) return '';
    const meta = KPI_META[key] || {};

    let valueText, changeHtml = '';

    if ('net_value_cr' in kpi) {
      // FII/DII: net inflow (green) vs net outflow (red)
      const net = kpi.net_value_cr;
      const cls = net > 0 ? 'up' : net < 0 ? 'down' : 'flat';
      const sign = net > 0 ? '+' : '';
      valueText = `${sign}${formatNumber(net)} Cr`;
      changeHtml = `<div class="kpi-change ${cls}">${escapeHtml(kpi.date || '')}</div>`;
    } else {
      const unit = kpi.unit ? ` ${kpi.unit}` : '';
      valueText = `${formatNumber(kpi.value)}${unit}`;
      if (typeof kpi.change_pct === 'number') {
        const cls = kpi.change_pct > 0 ? 'up' : kpi.change_pct < 0 ? 'down' : 'flat';
        const arrow = kpi.change_pct > 0 ? '▲' : kpi.change_pct < 0 ? '▼' : '–';
        changeHtml = `<div class="kpi-change ${cls}">${arrow} ${Math.abs(kpi.change_pct).toFixed(2)}%</div>`;
      }
    }

    return `
      <div class="kpi-tile" style="--tile-accent:${meta.accent || 'var(--hairline)'}">
        <div class="kpi-icon-label">
          <span class="kpi-icon" aria-hidden="true">${meta.icon || ''}</span>
          <span class="kpi-label">${escapeHtml(kpi.label)}</span>
        </div>
        <div class="kpi-value">${escapeHtml(valueText)}</div>
        ${changeHtml}
        <div class="kpi-stale">${kpi.fetched_at ? timeAgo(kpi.fetched_at) : ''}</div>
      </div>
    `;
  }

  function renderKpis(kpis) {
    const track = document.getElementById('kpiTrack');
    const tiles = KPI_ORDER.map(key => renderKpiTile(key, kpis[key])).filter(Boolean);
    track.innerHTML = tiles.length ? tiles.join('') : '';
  }

  async function loadKpis() {
    try {
      const res = await fetch('market_kpis.json', { cache: 'no-store' });
      if (!res.ok) return;
      renderKpis(await res.json());
    } catch (e) {
      // KPI strip just stays empty if market_kpis.json isn't there yet
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return (str || '').replace(/"/g, '&quot;');
  }

  async function loadAlerts() {
    try {
      const res = await fetch('alerts.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('alerts.json not found yet');
      const alerts = await res.json();
      render(alerts);
    } catch (e) {
      document.getElementById('feed').innerHTML =
        '<p class="empty-state">No alerts.json yet — run <code>uv run main.py</code> at least once.</p>';
    }
  }

  loadAlerts();
  loadKpis();
  setInterval(loadAlerts, REFRESH_MS);
  setInterval(loadKpis, REFRESH_MS);
</script>

</body>
</html>
