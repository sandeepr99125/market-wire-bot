[project]
name = "whatsapp-news-bot"
version = "0.1.0"
description = "Fetches market-moving news and (eventually) posts alerts to a WhatsApp Channel"
requires-python = ">=3.9"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

